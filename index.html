<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0, user-scalable=no">
<title>Web Windows — 最終統合版 (IndexedDB & 音楽プレーヤー)</title>
<style>
    /* CSSは省略（前回と同じ） */
    :root { --taskbar-h: 40px; --accent:#0078d7; --task-bg: rgba(32,32,32,0.92); }
    html,body{height:100%;width:100%;margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Helvetica Neue","Noto Sans JP",sans-serif;user-select:none;overflow:hidden;}
    body{
        background: url("https://upload.wikimedia.org/wikipedia/en/b/b3/Windows_10_default_wallpaper.png") center/cover no-repeat fixed;
        background-color:#0078d7;
    }

    .desktop{position:absolute;inset:0;pointer-events:auto;}
    .desktop-icon{position:absolute;width:92px;text-align:center;color:#fff;cursor:pointer;font-size:13px;line-height:1.1;padding:6px 4px;border-radius:6px;user-select:none;}
    .desktop-icon img{width:48px;height:48px;display:block;margin:0 auto 6px;filter: drop-shadow(0 1px 0 rgba(0,0,0,0.5));}
    .desktop-icon:hover{background:rgba(255,255,255,0.08);}

    #taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);background:var(--task-bg);display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#fff;z-index:9999;}
    .taskbar-left{display:flex;align-items:center;gap:8px;}
    #start{width:40px;height:40px;border-radius:4px;border:none;background:var(--accent);cursor:pointer;background-image:url('https://upload.wikimedia.org/wikipedia/commons/0/0b/Windows_logo_-_2021.svg');background-size:60%;background-position:center;background-repeat:no-repeat;filter:invert(1);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);}
    .taskbar-apps{display:flex;align-items:center;gap:6px;margin-left:6px;}
    .taskbar-icon{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:3px;cursor:pointer;opacity:0.95;}
    .taskbar-icon img{width:100%;height:100%;}
    .taskbar-icon.active{background:rgba(255,255,255,0.12);box-shadow:0 0 8px rgba(0,0,0,0.6) inset;}
    .taskbar-right{display:flex;align-items:center;gap:10px;color:#fff;}
    .clock{font-size:13px;padding-right:8px;}

    #startMenu{position:fixed;bottom:calc(var(--taskbar-h) + 8px);left:8px;width:240px;background:rgba(20,20,20,0.97);color:#fff;border-radius:8px;padding:8px;display:none;box-shadow:0 8px 30px rgba(0,0,0,0.6);z-index:10000;}
    #startMenu .item{padding:8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;}
    #startMenu .item:hover{background:rgba(255,255,255,0.06);}

    .window{position:absolute;background:#fff;border:1px solid #777;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,0.45);display:flex;flex-direction:column;overflow:hidden;min-width:220px;min-height:120px;z-index:10;resize:both;}
    .title-bar{background:var(--accent);color:#fff;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;cursor:move;font-weight:600;}
    .title-left{display:flex;align-items:center;gap:8px;}
    .title-btns button{background:transparent;border:none;color:#fff;cursor:pointer;font-size:14px;margin-left:6px;padding:4px 6px;border-radius:4px;width:30px;height:30px;line-height:1;}
    .title-btns button:hover{background:rgba(255,255,255,0.12);}
    .title-btns .close:hover{background:#c42b1c;color:#fff;}
    .content{flex:1;display:flex;flex-direction:column;min-height:0;background:#fafafa;overflow:hidden;padding:0;}

    /* explorer */
    .content-view{display:flex;flex-wrap:wrap;gap:12px;padding:10px 8px;overflow:auto;flex:1;}
    .file-icon{text-align:center;width:90px;cursor:pointer;padding:6px;border-radius:6px;box-sizing: border-box; position: relative;}
    .file-icon:hover{background:rgba(0,0,0,0.1);}
    .file-icon img{width:56px;height:56px;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto;object-fit:contain;}
    .file-icon div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#222;max-width: 100%;}
    .file-delete-btn {
        position: absolute;
        top: 0px; 
        right: 0px;
        background: rgba(255, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        line-height: 1;
        font-size: 14px;
        cursor: pointer;
        padding: 0;
        display: none;
    }
    .file-icon:hover .file-delete-btn { display: block; }

    /* notepad */
    .notepad-textarea{flex:1;width:100%;box-sizing:border-box;border:none;padding:8px;font-family:Consolas,monospace;font-size:13px;resize:none;outline:none;}

    /* tab/browser */
    .tab-container-bar{display:flex;background:#eee;border-bottom:1px solid #ccc;padding:4px;gap:6px;overflow-x:auto;flex-shrink:0;}
    .tab{background:#ddd;padding:4px 8px;border-radius:6px 6px 0 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-bottom:none;}
    .tab.active{background:#fff;border-color:#ccc;position:relative;z-index:1;}
    
    .tab-content{
        flex:1;
        min-height:0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;
    }
    .tab-content.active { 
        display: block !important;
    } 
    iframe{width:100%;height:100%;border:none;display:block;}

    /* メディアビューア/音楽プレーヤー用スタイル */
    .media-viewer-content {
        flex: 1;
        display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden;
    }
    .media-viewer-content img, .media-viewer-content video {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
    }
    .music-player-content {
        flex: 1; display: flex;
        flex-direction: column; justify-content: center; align-items: center; background: #222; color: #fff; padding: 20px;
    }
    .music-player-content audio {
        width: 100%; 
        max-width: 400px;
        margin-top: 20px;
    }
    .music-player-content h3 {
        word-break: break-all;
        text-align: center;
        max-width: 100%;
        padding: 0 10px;
        font-size: 16px;
    }

    .hidden{display:none !important;}
</style>
</head>
<body>

<div class="desktop" id="desktopArea">
    <div class="desktop-icon" style="top:40px;left:24px" onclick="launchBrowser()">
        <img src="https://img.icons8.com/color/48/internet--v1.png" alt="browser">
        <div>Webブラウザ</div>
    </div>

    <div class="desktop-icon" style="top:120px;left:24px" onclick="openExplorer()">
        <img src="https://img.icons8.com/fluency/48/folder-invoices.png" alt="explorer">
        <div>エクスプローラー</div>
    </div>

    <div class="desktop-icon" style="top:200px;left:24px" onclick="openNotepad()">
        <img src="https://img.icons8.com/fluency/48/note.png" alt="notepad">
        <div>メモ帳</div>
    </div>
</div>

<div id="taskbar">
    <div class="taskbar-left">
        <button id="start" title="スタート"></button>
        <div class="taskbar-apps" id="taskbar-apps"></div>
    </div>
    <div class="taskbar-right">
        <div class="clock" id="clock"></div>
    </div>
</div>

<div id="startMenu">
    <div class="item" onclick="launchBrowser()">🌐 Webブラウザ</div>
    <div class="item" onclick="openExplorer()">📁 エクスプローラー</div>
    <div class="item" onclick="openNotepad()">📝 メモ帳</div>
</div>

<script>
/* 定数 */
// ★IndexedDB対応のため、この制限はブラウザの物理的制限ではなく、あくまで表示上の目安になります。
const MAX_STORAGE_BYTES = 1048576 * 300;
const DB_NAME = "WebWinFiles";
const DB_VERSION = 1;
const STORE_NAME = "files";

/* IndexedDBの初期化と取得 */
let dbPromise;
function getDbPromise() {
    if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onerror = (event) => {
                console.error("IndexedDBエラー:", event.target.errorCode);
                alert("データベースを開けませんでした。");
                reject(event.target.error);
            };

            request.onsuccess = (event) => {
                resolve(event.target.result);
            };

            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "filename" });
                }
            };
        });
    }
    return dbPromise;
}

// IndexedDBへのトランザクションを実行するヘルパー
async function transaction(mode) {
    const db = await getDbPromise();
    const tx = db.transaction(STORE_NAME, mode);
    const store = tx.objectStore(STORE_NAME);
    return { store, tx };
}

/* ファイル操作 - IndexedDB対応 (すべて非同期/awaitが必要) */

/**
 * ファイルをIndexedDBに保存する
 * @param {string} filename - ファイル名 (キー)
 * @param {string} content - ファイルの中身 (Data URL)
 * @returns {Promise<boolean>} 成功したらtrue
 */
async function saveFileToIndexedDB(filename, content) {
    try {
        const { store, tx } = await transaction("readwrite");
        const fileRecord = { filename, content, size: content.length * 2 }; // サイズは概算
        
        await new Promise((resolve, reject) => {
            const request = store.put(fileRecord);
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e.target.error);
        });
        await new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(true);
            tx.onerror = (e) => reject(e.target.error);
            tx.onabort = () => reject(new Error('Transaction aborted'));
        });
        return true;
    } catch (e) {
        console.error("ファイル保存エラー:", e);
        if (e.name === 'QuotaExceededError') {
             alert(`警告！保存容量制限を超えました。\nブラウザの設定で保存できませんでした。`);
        } else {
             alert(`ファイル保存中にエラーが発生しました: ${e.message}`);
        }
        return false;
    }
}

/**
 * ファイルをIndexedDBから読み込む
 * @param {string} filename - ファイル名 (キー)
 * @returns {Promise<{filename: string, content: string, size: number} | null>} ファイルレコード
 */
async function getFileFromIndexedDB(filename) {
    try {
        const { store } = await transaction("readonly");
        return await new Promise((resolve, reject) => {
            const request = store.get(filename);
            request.onsuccess = () => resolve(request.result);
            request.onerror = (e) => reject(e.target.error);
        });
    } catch (e) {
        console.error("ファイル読み込みエラー:", e);
        return null;
    }
}

/**
 * ファイルをIndexedDBから削除する
 * @param {string} filename - ファイル名 (キー)
 * @returns {Promise<boolean>} 成功したらtrue
 */
async function deleteFileFromIndexedDB(filename) {
    try {
        const { store, tx } = await transaction("readwrite");
        await new Promise((resolve, reject) => {
            const request = store.delete(filename);
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e.target.error);
        });
        await new Promise(resolve => { tx.oncomplete = resolve; }); // トランザクション完了を待つ
        return true;
    } catch (e) {
        console.error("ファイル削除エラー:", e);
        return false;
    }
}

/**
 * すべてのファイル名と概算サイズを取得する
 * @returns {Promise<Array<{filename: string, size: number}>>}
 */
async function listAllFiles() {
    try {
        const { store } = await transaction("readonly");
        return await new Promise((resolve, reject) => {
            const files = [];
            const request = store.openCursor();
            request.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    files.push({ filename: cursor.value.filename, size: cursor.value.size || 0 });
                    cursor.continue();
                } else {
                    resolve(files);
                }
            };
            request.onerror = (e) => reject(e.target.error);
        });
    } catch (e) {
        console.error("ファイル一覧取得エラー:", e);
        return [];
    }
}

/**
 * 全データを削除する（フォーマット）関数
 */
async function formatStorage(){
    const allFiles = await listAllFiles();
    if(allFiles.length === 0){
        alert("削除するファイルがありませんでした。");
        return;
    }

    if(confirm(`警告: すべてのデータ (${allFiles.length}個のファイル) を完全に削除します。よろしいですか？\n(この操作は元に戻せません)`)){
        try {
            const { store, tx } = await transaction("readwrite");
            await new Promise((resolve, reject) => {
                const request = store.clear();
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
            await new Promise(resolve => { tx.oncomplete = resolve; });

            alert("ストレージをフォーマットし、すべてのファイルを削除しました。");
            updateExplorerViews();
        } catch(e) {
            alert(`フォーマット中にエラーが発生しました: ${e.message}`);
        }
    }
}


/* 使用量概算 (IndexedDB対応) */
async function getUsedStorageBytes(){
    const files = await listAllFiles();
    let total = 0;
    files.forEach(f => { total += f.size; });
    
    // ブラウザのQuota APIがあれば使う（今回はシンプルに概算のみで）
    return total;
}


/* ウィンドウ管理 (変更なし) */
let zIndexCounter = 2000;
let winIdCounter = 0;
const winRegistry = {};
function createWindow({title='Window', contentHTML='', width=700, height=420, icon=null}){
    const id = 'win_' + (++winIdCounter);
    const win = document.createElement('div');
    win.className = 'window';
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    const offset = (winIdCounter % 6) * 18;
    const cx = Math.max(12, (innerWidth - width)/2 + offset);
    const cy = Math.max(24, (innerHeight - height - 40)/2 + offset);
    win.style.left = cx + 'px';
    win.style.top = cy + 'px';
    win.style.zIndex = ++zIndexCounter;
    win.dataset.winId = id;
    win.title = title;
    win.innerHTML = `
        <div class="title-bar">
            <div class="title-left"><strong>${title}</strong></div>
            <div class="title-btns">
                <button class="minimize" title="最小化">—</button>
                <button class="maximize" title="最大化">▢</button>
                <button class="close" title="閉じる">✕</button>
            </div>
        </div>
        <div class="content">${contentHTML}</div>
    `;
    document.body.appendChild(win);
    winRegistry[id] = { win, title, icon };

    win.addEventListener('mousedown', () => { win.style.zIndex = ++zIndexCounter; updateTaskbar(); });
    win.addEventListener('touchstart', () => { win.style.zIndex = ++zIndexCounter; updateTaskbar(); });

    const titleBar = win.querySelector('.title-bar');
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    function getCoords(e){
        if(e.touches && e.touches.length) return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
        return { clientX: e.clientX, clientY: e.clientY };
    }

    function dragStart(e) {
        if(e.target.closest('.title-btns')) return;
        e.preventDefault(); 
        const coords = getCoords(e);
        dragging=true; 
        sx=coords.clientX; 
        sy=coords.clientY; 
        ox=parseFloat(win.style.left)||0; 
        oy=parseFloat(win.style.top)||0; 
        win.style.transition='none';
    }
    
    function dragMove(e) { 
        if(!dragging) return;
        const coords = getCoords(e);
        win.style.left = (ox + (coords.clientX - sx)) + 'px';
        win.style.top = (oy + (coords.clientY - sy)) + 'px'; 
    }
    
    function dragEnd() { 
        if(dragging){
            dragging=false;
            win.style.transition='box-shadow 0.1s, transform 0.2s';
        } 
    }
    
    titleBar.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragEnd);
    
    titleBar.addEventListener('touchstart', dragStart);
    document.addEventListener('touchmove', dragMove);
    document.addEventListener('touchend', dragEnd);

    const btnMin = win.querySelector('.minimize');
    const btnMax = win.querySelector('.maximize');
    const btnClose = win.querySelector('.close');
    
    [btnMin, btnMax, btnClose].forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); });
        btn.addEventListener('touchend', e => { e.stopPropagation(); });
    });
    let prevRect = null;
    btnMin.onclick = () => { win.style.display = 'none'; updateTaskbar(); };
    btnClose.onclick = () => { 
        // 音楽プレーヤーを閉じる際に再生を停止
        if(win.dataset.app === 'media-player') {
            const audioEl = win.querySelector('audio');
            if(audioEl) audioEl.pause();
        }
        win.remove(); delete winRegistry[id]; updateTaskbar(); updateExplorerViews(); 
    };
    btnMax.onclick = () => {
        if(!prevRect){
            prevRect = {left:win.style.left, top:win.style.top, width:win.style.width, height:win.style.height};
            win.style.left = '0px'; win.style.top = '0px'; win.style.width = '100vw'; win.style.height = 'calc(100vh - var(--taskbar-h))';
            btnMax.textContent = '❐';
        } else {
            win.style.left = prevRect.left; win.style.top = prevRect.top;
            win.style.width = prevRect.width; win.style.height = prevRect.height; prevRect = null;
            btnMax.textContent = '▢'; 
        }
    };

    registerWindowToTaskbar(id, title, icon);
    return { id, win };
}

/* タスクバー管理 (変更なし) */
const taskbarAppsEl = document.getElementById('taskbar-apps');
function registerWindowToTaskbar(id, title, iconUrl){
    if(taskbarAppsEl.querySelector(`[data-win="${id}"]`)) return;
    const el = document.createElement('div');
    el.className = 'taskbar-icon';
    el.dataset.win = id;
    const img = document.createElement('img');
    img.alt = title;
    img.draggable = false;
    img.src = iconUrl || 'https://img.icons8.com/fluency/48/windows-10.png';
    el.appendChild(img);
    el.title = title;
    el.onclick = () => {
        const obj = winRegistry[id];
        if(!obj){ el.remove(); updateTaskbar(); return; }
        const w = obj.win;
        if(w.style.display === 'none' || window.getComputedStyle(w).display === 'none'){
            w.style.display = 'flex';
            w.style.zIndex = ++zIndexCounter;
        } else {
            w.style.display = 'none';
        }
        updateTaskbar();
    };
    taskbarAppsEl.appendChild(el);
    updateTaskbar();
}

function updateTaskbar(){
    const icons = taskbarAppsEl.querySelectorAll('.taskbar-icon');
    icons.forEach(ic => {
        const id = ic.dataset.win;
        const reg = winRegistry[id];
        if(!reg){ ic.remove(); return; }
        const visible = reg.win.style.display !== 'none' && window.getComputedStyle(reg.win).display !== 'none';
        ic.classList.toggle('active', visible);
    });
}

/* スタートメニュー (変更なし) */
document.getElementById('start').onclick = () => {
    const startMenu = document.getElementById('startMenu');
    if(startMenu.style.display === 'none' || window.getComputedStyle(startMenu).display === 'none'){
        startMenu.style.display = 'block';
    } else {
        startMenu.style.display = 'none';
    }
};
document.body.addEventListener('click', (e) => {
    const startMenu = document.getElementById('startMenu');
    if(startMenu.style.display !== 'none' && !document.getElementById('start').contains(e.target) && !startMenu.contains(e.target)){
        startMenu.style.display = 'none';
    }
});


/* 時刻表示 (変更なし) */
function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh + ':' + mm;
}
setInterval(updateClock, 1000);
updateClock();

/* Webブラウザ (変更なし) */
function launchBrowser(){
    for(const id in winRegistry){
        if(winRegistry[id].title === 'Webブラウザ'){
            const obj = winRegistry[id];
            obj.win.style.display='flex';
            obj.win.style.zIndex = ++zIndexCounter;
            updateTaskbar();
            return;
        }
    }
    const localId = winIdCounter + 1;
    const browserHTML = `
        <div style="display:flex;flex-direction:column;height:100%;">
            <div class="tab-container-bar"><div class="tab-bar" id="tabbar_${localId}"></div><button id="newtab_${localId}" style="margin-left:auto;padding:4px 8px;">＋ 新しいタブ</button></div>
            <div style="display:flex;gap:6px;padding:6px;background:#f0f0f0;border-bottom:1px solid #ccc;flex-shrink:0;">
                <input id="url_${localId}" type="text" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;" value="https://example.com" placeholder="URLを入力してEnter">
                <button id="gobtn_${localId}">開く</button>
            </div>
            <div id="iframes_${localId}" style="flex:1;overflow:hidden;min-height:0; position: relative;"></div>
        </div>
    `;
    const { id, win } = createWindow({title:'Webブラウザ', contentHTML:browserHTML, width:840, height:560, icon:'https://img.icons8.com/color/48/internet--v1.png'});
    const tabbar = win.querySelector(`#tabbar_${localId}`);
    const iframes = win.querySelector(`#iframes_${localId}`);
    const urlInput = win.querySelector(`#url_${localId}`);
    const goBtn = win.querySelector(`#gobtn_${localId}`);
    const newTabBtn = win.querySelector(`#newtab_${localId}`);
    let tabs = [];
    let tabIndex = 0;
    let activeTabIdx = -1;

    function createTab(url, activate=true){
        const idx = tabIndex++;
        const tabEl = document.createElement('div');
        tabEl.className='tab';
        tabEl.innerHTML = `<span>${(url.replace(/^https?:\/\//,'').split('/')[0]||'新しいタブ')}</span> <span class="close-tab-btn" data-idx="${idx}" style="font-weight:bold;margin-left:4px;">✕</span>`;
        tabEl.dataset.idx = idx;
        
        const frame = document.createElement('iframe');
        frame.src = url;
        frame.sandbox = "allow-same-origin allow-scripts allow-forms allow-downloads allow-modals allow-top-navigation-by-user";

        const tabWrap = document.createElement('div');
        tabWrap.className = 'tab-content';
        tabWrap.dataset.idx = idx;
        tabWrap.appendChild(frame);

        tabbar.appendChild(tabEl);
        iframes.appendChild(tabWrap);

        tabEl.querySelector('span').onclick = ()=> setActive(idx);
        tabEl.querySelector('.close-tab-btn').addEventListener('click', (e) => closeTab(e, idx));

        tabs.push({idx, tabEl, tabWrap, url});
        if(activate) setActive(idx);
    }

    function closeTab(e, idx){
        e.stopPropagation();
        const tab = tabs.find(t => t.idx === idx);
        if(tab){
            tab.tabEl.remove();
            tab.tabWrap.remove();
            tabs = tabs.filter(t => t.idx !== idx);
            if(activeTabIdx === idx && tabs.length > 0){
                setActive(tabs[tabs.length - 1].idx);
            } else if (tabs.length === 0){
                win.remove(); delete winRegistry[id]; updateTaskbar();
                return;
            }
        }
    }

    function setActive(idx){
        activeTabIdx = idx;
        tabs.forEach(t => {
            const isActive = t.idx === idx;
            t.tabEl.classList.toggle('active', isActive);
            t.tabWrap.classList.toggle('active', isActive);
            if(isActive){
                urlInput.value = t.url;
            }
        });
    }

    function navigate(url){
        let fullUrl = url.trim();
        if(!fullUrl.match(/^(https?|ftp):\/\//i)){
            fullUrl = 'https://' + fullUrl;
        }
        
        const activeTab = tabs.find(t => t.idx === activeTabIdx);
        if(activeTab){
            activeTab.url = fullUrl;
            activeTab.tabWrap.querySelector('iframe').src = fullUrl;
            activeTab.tabEl.querySelector('span').textContent = fullUrl.replace(/^https?:\/\//,'').split('/')[0]||'新しいタブ';
        }
    }

    urlInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
            navigate(urlInput.value);
        }
    });

    goBtn.onclick = () => navigate(urlInput.value);
    newTabBtn.onclick = () => createTab('about:blank');

    // 初期タブ
    createTab('about:blank', true);
    win.style.zIndex = ++zIndexCounter;
    updateTaskbar();
}

/* メディアビューア - IndexedDB対応 (awaitでファイル内容を取得) */
async function openMediaViewer(filename){
    const fileRecord = await getFileFromIndexedDB(filename); //
    if (!fileRecord) {
        alert(`ファイル「${filename}」が見つかりませんでした。`);
        return;
    }
    const dataUrl = fileRecord.content;
    const lowerFname = filename.toLowerCase();

    let mediaElement = '';
    const isImage = dataUrl.startsWith('data:image/') || lowerFname.endsWith('.jpg') || lowerFname.endsWith('.jpeg') || lowerFname.endsWith('.png') || lowerFname.endsWith('.gif') || lowerFname.endsWith('.webp');
    const isVideo = dataUrl.startsWith('data:video/');

    if (isImage) {
        mediaElement = `<img src="${dataUrl}" alt="${filename}">`;
    } else if (isVideo) {
        mediaElement = `<video controls autoplay src="${dataUrl}" type="${dataUrl.split(';')[0].replace('data:','')}" style="max-height:100%; max-width:100%;"></video>`;
    } else {
        alert(`「${filename}」は画像・動画ファイルとして認識できません。`);
        return;
    }

    const html = `
        <div class="media-viewer-content">
            ${mediaElement}
        </div>
    `;
    const { id, win } = createWindow({title: filename, contentHTML:html, width:800, height:600, icon: isImage ? 'https://img.icons8.com/fluency/48/picture.png' : 'https://img.icons8.com/fluency/48/video.png'});
    win.style.backgroundColor = '#000';
    updateTaskbar();
}

/* 音楽プレーヤー - IndexedDB対応 (awaitでファイル内容を取得) */
async function openMediaPlayer(filename){
    const fileRecord = await getFileFromIndexedDB(filename); //
    if (!fileRecord) {
        alert(`ファイル「${filename}」が見つかりませんでした。`);
        return;
    }
    const dataUrl = fileRecord.content;
    if (!dataUrl.startsWith('data:audio/')) {

/* エクスプローラー - IndexedDB対応 (非同期処理に書き換え) */
function openExplorer(){
    for(const id in winRegistry){
        if(winRegistry[id].title === 'エクスプローラー'){
            const obj = winRegistry[id];
            obj.win.style.display='flex';
            obj.win.style.zIndex=++zIndexCounter;
            if(typeof obj.win.renderFiles === 'function') obj.win.renderFiles(); // ファイルリストの再描画
            updateTaskbar();
            return;
        }
    }

    const localId = winIdCounter + 1;
    const html = `
        <div style="display:flex;flex-direction:column;height:100%;">
            <div style="display:flex;align-items:center;gap:8px;padding:6px;background:#f0f0f0;border-bottom:1px solid #ccc;flex-shrink:0;">
                <strong>📁 ドキュメント</strong>
                <button id="newtxt_${localId}">新しいメモ</button>
                <input type="file" id="fileinput_${localId}" style="display:none;" multiple accept="*/*">
                <button id="uploadbtn_${localId}">⬆️ ファイルをアップロード</button>
                <button id="formatbtn_${localId}" style="margin-left:auto; background:#f00; color:white; border:none; padding: 4px 8px; border-radius: 4px;">🧹 全データ削除</button>
            </div>
            <div id="fileArea_${localId}" class="content-view">
                <div style="padding:24px;color:#666">ファイルを読み込み中...</div>
            </div>
            <div id="statusArea_${localId}" style="padding:4px 8px;font-size:12px;color:#666;border-top:1px solid #ccc;flex-shrink:0;"></div>
        </div>
    `;

    const { id, win } = createWindow({title:'エクスプローラー', contentHTML:html, width:750, height:500, icon:'https://img.icons8.com/fluency/48/folder-invoices.png'});
    win.dataset.app = 'explorer';

    const area = win.querySelector(`#fileArea_${localId}`);
    const statusArea = win.querySelector(`#statusArea_${localId}`);
    const uploadBtn = win.querySelector(`#uploadbtn_${localId}`);
    const fileInput = win.querySelector(`#fileinput_${localId}`);
    const formatBtn = win.querySelector(`#formatbtn_${localId}`);
    const newTxtBtn = win.querySelector(`#newtxt_${localId}`);

    async function updateStatus(){
        const used = await getUsedStorageBytes();
        const usedKB = (used / 1024).toFixed(2);
        statusArea.textContent = `総ファイル数: ${area.querySelectorAll('.file-icon').length} / 使用容量概算: ${usedKB} KB`;
    }

    // ファイルリストを描画する関数をウィンドウオブジェクトに追加
    win.renderFiles = async function renderFiles(){
        area.innerHTML = `<div style="padding:24px;color:#666">ファイルを読み込み中...</div>`;
        const files = await listAllFiles(); //
        area.innerHTML = '';
        let count = 0;

        for(const file of files){
            const fname = file.filename;
            const lowerFname = fname.toLowerCase();
            let icon = 'https://img.icons8.com/fluency/48/file.png';
            let clickAction = ()=> alert(`ファイル「${fname}」を開くには、対応するアプリが必要です。`);

            if(lowerFname.endsWith('.txt')){
                icon='https://img.icons8.com/fluency/48/note.png';
                clickAction = ()=> openNotepad(fname);
            } else if(lowerFname.endsWith('.html') || lowerFname.endsWith('.htm')){
                icon='https://img.icons8.com/fluency/48/html-5.png';
                clickAction = ()=> launchBrowser(fname); // ブラウザで開く
            } else if(lowerFname.endsWith('.jpg') || lowerFname.endsWith('.jpeg') || lowerFname.endsWith('.png') || lowerFname.endsWith('.gif') || lowerFname.endsWith('.webp')){
                icon='https://img.icons8.com/fluency/48/picture.png';
                // 画像ファイルの内容は表示時に取得する
                clickAction = ()=> openMediaViewer(fname);
            } else if(lowerFname.endsWith('.mp4') || lowerFname.endsWith('.webm')){
                icon='https://img.icons8.com/fluency/48/video.png';
                clickAction = ()=> openMediaViewer(fname);
            } else if(lowerFname.endsWith('.mp3') || lowerFname.endsWith('.wav') || lowerFname.endsWith('.ogg')){
                icon='https://img.icons8.com/fluency/48/music.png';
                clickAction = ()=> openMediaPlayer(fname);
            }
            // アイコンのサムネイル表示は今回はスキップ (画像の場合もopenMediaViewerに任せる)
            
            const iconElement = `<img src="${icon}" alt="${fname}">`;
            const el = document.createElement('div');
            el.className='file-icon';
            el.title = fname;
            el.innerHTML = `${iconElement}<div>${fname}</div><button class="file-delete-btn" data-fname="${fname}">✕</button>`;
            el.onclick = clickAction;

            el.querySelector('.file-delete-btn').addEventListener('click', async (e) => {
                e.stopPropagation();
                const targetFname = e.target.dataset.fname;
                if(confirm(`「${targetFname}」を削除してもいい？`)){
                    const success = await deleteFileFromIndexedDB(targetFname); //
                    if(success) {
                        alert(`「${targetFname}」を削除したよ。`);
                        renderFiles();
                    } else {
                        alert(`「${targetFname}」の削除に失敗しました。`);
                    }
                }
            });

            area.appendChild(el);
            count++;
        }
        if(count===0) area.innerHTML = `<div style="padding:24px;color:#666">ここにファイルはありません。</div>`;
        await updateStatus();
    }

    formatBtn.onclick = formatStorage;
    uploadBtn.onclick = () => { fileInput.click(); };
    fileInput.onchange = async (e) => {
        if (e.target.files.length === 0) return;

        // ファイルの競合チェック
        const existingFiles = (await listAllFiles()).map(f => f.filename);
        
        for (const file of e.target.files) {
            let filename = file.name;
            let counter = 1;
            while(existingFiles.includes(filename)) {
                // 既存ファイル名と衝突しないようにリネーム
                const parts = file.name.split('.');
                const ext = parts.pop();
                const base = parts.join('.');
                filename = `${base}(${counter++}).${ext}`;
            }

            const reader = new FileReader();
            reader.onload = async () => {
                const dataUrl = reader.result;
                const success = await saveFileToIndexedDB(filename, dataUrl); //
                if(success) existingFiles.push(filename); // 登録成功したらリストに追加
                else alert(`ファイル「${filename}」のアップロードに失敗しました。`);
                
                // すべてのファイルが処理されたら再描画
                if(Array.from(e.target.files).indexOf(file) === e.target.files.length - 1) {
                    renderFiles();
                }
            };
            // Data URL形式でファイルを読み込む
            // ファイルの種類に応じてreadAsDataURLまたはreadAsTextを使用するのが望ましいが、Data URLとして統一する
            reader.readAsDataURL(file); 
        }

        e.target.value = null; // 同じファイルを続けて選択できるようにリセット
    };
    newTxtBtn.onclick = () => openNotepad();

    win.renderFiles(); // 初回描画
    updateTaskbar();
}

/* メモ帳 - IndexedDB対応 (文字化け対策を含む) */
async function openNotepad(filename='無題.txt'){
    const currentFilename = filename;
    let fileRecord = null;
    let isNewFile = currentFilename === '無題.txt';

    if(!isNewFile) {
        fileRecord = await getFileFromIndexedDB(currentFilename); //
        if(!fileRecord) {
            alert(`ファイル「${currentFilename}」が見つかりませんでした。`);
            return;
        }
    } else {
        // 新規ファイルの場合、ファイル名衝突がないかチェックし、あればリネーム
        let tempName = '無題.txt';
        let counter = 1;
        while(await getFileFromIndexedDB(tempName)) {
            tempName = `無題(${counter++}).txt`;
        }
        currentFilename = tempName;
    }
    
    for(const id in winRegistry){
        if(winRegistry[id].title === currentFilename){
            const obj = winRegistry[id];
            obj.win.style.display='flex';
            obj.win.style.zIndex=++zIndexCounter;
            updateTaskbar();
            return;
        }
    }

    const html = `
        <div style="display:flex;flex-direction:column;height:100%;">
            <div style="display:flex;gap:6px;padding:4px 8px;background:#f0f0f0;border-bottom:1px solid #ccc;flex-shrink:0;">
                <button id="savebtn">💾 保存</button>
                <button id="delbtn" style="${isNewFile ? 'display:none;' : ''}">🗑️ 削除</button>
                <div style="margin-left:auto; font-size:12px; line-height:30px;">ファイル名: ${currentFilename}</div>
            </div>
            <textarea id="notepad-textarea" class="notepad-textarea" placeholder="ここにテキストを入力..." disabled></textarea>
        </div>
    `;

    const { id, win } = createWindow({title: currentFilename, contentHTML:html, width:600, height:400, icon:'https://img.icons8.com/fluency/48/note.png'});
    win.dataset.app = 'notepad';

    const textarea = win.querySelector('#notepad-textarea');
    const savebtn = win.querySelector('#savebtn');
    const delbtn = win.querySelector('#delbtn');

    // ★ 修正箇所: 読み込み処理
    async function loadFile(){
        if(isNewFile) {
            textarea.value = '';
            textarea.disabled = false;
            savebtn.disabled = false;
            return;
        }

        const data = fileRecord.content;
        const isBinary = data.startsWith('data:image/') || data.startsWith('data:video/') || data.startsWith('data:audio/');
        
        if(isBinary){
            textarea.value = `[バイナリファイル: ${currentFilename}]\n\n※画像、動画、音声などのバイナリファイルは、メモ帳で内容を編集・表示することはできません。`;
            textarea.disabled = true;
            savebtn.disabled = true;
        } else {
            let content = '';
            const parts = data.split(',');
            
            if (parts.length === 2) {
                if (parts[0].includes(';base64')) {
                    // Base64形式の場合（新しい保存形式）
                    content = base64DecodeUnicode(parts[1]);

                } else {
                    // パーセントエンコード形式（旧形式）の場合
                    try {
                        content = decodeURIComponent(parts[1]);
                    } catch(e) {
                        content = "【ファイルの内容を読み込めませんでした。文字コードが不正な可能性があります。】";
                        console.warn("旧形式ファイルのデコードエラー:", e);
                    }
                }
            } else {
                 content = "【ファイルの内容を読み込めませんでした。Data URLが不正です。】";
            }
            
            textarea.value = content;
            textarea.disabled = false;
            savebtn.disabled = false;
        }
    }

    // ★ 修正箇所: 保存処理
    async function saveFile(){
        if(textarea.disabled) {
            alert('このファイルは編集できません。');
            return;
        }
        
        let filename = prompt("ファイル名を入力してください（例: memo.txt）", currentFilename);
        if(!filename) return;

        // 拡張子チェック
        if(!filename.toLowerCase().endsWith('.txt')) filename += '.txt';

        const newText = textarea.value || ''; 
        
        // Data URL形式に変換（文字化けを防ぐため、Unicode対応のBase64を使用）
        const base64Content = base64EncodeUnicode(newText);
        const dataUrl = `data:text/plain;charset=utf-8;base64,${base64Content}`;

        // ファイル名を変更した場合は既存ファイルを削除する必要がある
        if(!isNewFile && filename !== currentFilename) {
            await deleteFileFromIndexedDB(currentFilename);
        }

        const success = await saveFileToIndexedDB(filename, dataUrl); //

        if(success) {
            alert(`「${filename}」を保存したよ。`);
            // ファイル名が変わった場合、ウィンドウを閉じて新しいファイル名で開く
            if(filename !== currentFilename) {
                win.remove(); delete winRegistry[id];
                openNotepad(filename);
            } else {
                // ファイル一覧を更新
                updateExplorerViews();
            }
        }
    }

    async function deleteFile(){
        if(currentFilename === '無題.txt'){
            alert('無題のファイルは削除できないよ。');
            return;
        }
        if(!confirm(`「${currentFilename}」を削除してもいい？`)) return;
        
        const success = await deleteFileFromIndexedDB(currentFilename); //
        if(success) {
            alert(`「${currentFilename}」を削除したよ。`);
            win.remove();
            delete winRegistry[id]; 
            updateExplorerViews();
            updateTaskbar();
        } else {
            alert(`「${currentFilename}」の削除に失敗しました。`);
        }
    }
    
    savebtn.onclick = saveFile;
    delbtn.onclick = deleteFile;
    loadFile();
    updateTaskbar();
}

/* Base64 Unicode対応ヘルパー関数（文字化け対策） */
function base64EncodeUnicode(str) {
    // UTF-8バイト列に変換 -> バイナリ文字列 -> Base64
    const utf8Bytes = new TextEncoder().encode(str);
    const binString = String.fromCodePoint(...utf8Bytes);
    return btoa(binString);
}

function base64DecodeUnicode(base64) {
    try {
        // Base64 -> バイナリ文字列 -> UTF-8バイト列から文字列にデコード
        const binString = atob(base64);
        const utf8Bytes = Uint8Array.from(binString, m => m.codePointAt(0));
        return new TextDecoder().decode(utf8Bytes);
    } catch (e) {
        console.error("Base64デコードエラー:", e);
        return ""; // デコード失敗時は空文字列を返す
    }
}


/* 画面リサイズでウィンドウがはみ出さないように補正 (変更なし) */
function updateExplorerViews(){
    document.querySelectorAll('.window[data-app="explorer"]').forEach(w => {
        if(typeof w.renderFiles === 'function') w.renderFiles();
    });
}

window.addEventListener('resize', () => {
    document.querySelectorAll('.window').forEach(w => {
        const rect = w.getBoundingClientRect();
        let changed=false;
        if(rect.right > innerWidth) { w.style.left = Math.max(8, innerWidth - rect.width - 8) + 'px'; changed=true; }
        if(rect.bottom > innerHeight - 40) { w.style.top = Math.max(8, innerHeight - rect.height - 40) + 'px'; changed=true; }
        if(changed) w.style.zIndex = ++zIndexCounter;
    });
});
